<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jQuery Validation compatibility demo</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  label.field { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; box-sizing: border-box; }
  input.error { border-color: #b00020; }
  input.valid { border-color: #1b7f3b; }
  label.error { color: #b00020; font-size: .875rem; font-weight: 400; display: block; }
  button { margin-top: 1.25rem; padding: .6rem 1.2rem; }
  #log { background: #f4f4f4; padding: .75rem; margin-top: 1rem; white-space: pre-wrap; font-size: .85rem; }
</style>
</head>
<body>
<main>
<h1>Same code as the jQuery Validation plugin</h1>
<p>Only the script tags changed. The <code>$('#f').validate({...})</code> call is the original API.</p>

<form id="f" action="#" method="get">
  <label class="field" for="email">Email</label>
  <input id="email" name="email">

  <label class="field" for="pw">Password</label>
  <input id="pw" name="pw" type="password">

  <label class="field" for="pw2">Repeat password</label>
  <input id="pw2" name="pw2" type="password">

  <label class="field" for="zip">ZIP code (class rule)</label>
  <input id="zip" name="zip" class="zip">

  <label class="field" for="age">Age (data attributes)</label>
  <input id="age" name="age" data-rule-required="true" data-rule-digits="true" data-rule-range="[18,99]" data-msg-range="You must be 18 to 99">

  <button type="submit">Send</button>
  <button type="submit" class="cancel">Cancel (skips validation)</button>
</form>
<div id="log">Nothing is sent anywhere.</div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="dist/validator.min.js"></script>
<script>
  $.validator.addClassRules('zip', { required: true, digits: true, minlength: 5, maxlength: 5 });
  $.validator.addMethod('notPassword', function (value, element) {
    return this.optional(element) || value.toLowerCase() !== 'password';
  }, 'Please pick a stronger password.');

  $('#f').validate({
    rules: {
      email: { required: true, email: true },
      pw:    { required: true, minlength: 8, notPassword: true },
      pw2:   { equalTo: '#pw' }
    },
    messages: {
      email: { required: 'We need your email address' },
      pw2:   { equalTo: 'The passwords do not match' }
    },
    submitHandler: function (form) {
      $('#log').text('Valid! Would submit: ' + $(form).serialize());
    },
    invalidHandler: function (event, validator) {
      $('#log').text(validator.numberOfInvalids() + ' problem(s) to fix.');
    }
  });
</script>
</body>
</html>
