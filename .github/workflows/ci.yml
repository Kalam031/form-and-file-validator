name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:jquery3
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        shell: bash
        env:
          BROWSERS: chromium,firefox,webkit,mobile-safari,mobile-chrome
        run: |
          set +e
          report() {
            # the names of the failed tests and the first lines of each error, as annotations, so they are readable without opening the log
            sed -n '/failing tests/,$p' browser.log | grep -E "✖|Error|expected|actual" | head -20 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          }
          npm run test:browser 2>&1 | tee browser.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            report
            # a shared runner can be slow: one retry, with a visible warning (a real failure fails again)
            echo "::warning::browser tests failed once; retrying"
            npm run test:browser 2>&1 | tee browser.log
            status=${PIPESTATUS[0]}
            [ $status -ne 0 ] && report
          fi
          exit $status
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # the .NET port must give the same answers as the JavaScript package: both run spec/form-rules.vectors.json
      - run: dotnet test dotnet/FormAndFileValidator.Tests
      # the netstandard2.0 build (what .NET Framework and MVC 5 use) on a modern runtime
      - run: dotnet test dotnet/FormAndFileValidator.Tests -p:TestTfm=net10.0 -p:Tfm=netstandard2.0
  dotnet-framework:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # ASP.NET MVC 5 runs on .NET Framework 4.x: the vectors and the MVC helpers on the real thing
      - run: dotnet test dotnet/FormAndFileValidator.Tests -p:TestTfm=net48 -p:Tfm=netstandard2.0
      - run: dotnet test dotnet/FormAndFileValidator.Mvc5.Tests
