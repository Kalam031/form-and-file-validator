name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:jquery3
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        shell: bash
        env:
          BROWSERS: chromium,firefox,webkit,mobile-safari,mobile-chrome
        run: |
          set +e
          npm run test:browser 2>&1 | tee browser.log
          status=${PIPESTATUS[0]}
          # failures as annotations, so they are readable without opening the log
          grep -E "^\s*✖|AssertionError|Error:|TimeoutError" browser.log | head -12 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          exit $status
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # the .NET port must give the same answers as the JavaScript package: both run spec/form-rules.vectors.json
      - run: dotnet test dotnet/FormAndFileValidator.Tests
