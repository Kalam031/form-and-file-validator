name: Publish to npm
# Trusted publishing (OIDC): npm trusts THIS workflow file, so there is no npm token and no 2FA prompt.
# Setup once on npmjs.com: package form-and-file-validator -> Settings -> Trusted Publisher -> GitHub Actions
#   Organization or user: Kalam031 | Repository: form-and-file-validator | Workflow filename: publish.yml | Environment: (empty)
# Release: bump the version in package.json, push, wait for CI to be green, then push a tag:  git tag v3.4.1 && git push origin v3.4.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # lets npm verify that this run comes from the trusted workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24          # npm 11.5.1 or newer is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      # the same tests as CI, so nothing is published from a broken tree
      - run: npm test
      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; fi
      - name: Skip when this version is already on npm
        id: exists
        run: |
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "already=true" >> "$GITHUB_OUTPUT"; echo "$name@$version is already published"; else echo "already=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        if: steps.exists.outputs.already == 'false'
        run: npm publish --access public
